[package]
name = "vairedb-common"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# `udaf` defines the aggregate functions both node kinds must register, so this
# crate needs the engine they are written against.
datafusion = { workspace = true }
# `pg_udf` re-registers the `pg_catalog` scalar functions on both node kinds, so the
# crate that defines them is needed on both sides of the wire too.
datafusion-pg-catalog = { workspace = true }
arrow = { workspace = true }
# `pg_datetime` computes `age()` and `make_timestamp()` the way PostgreSQL defines them,
# which is in civil-calendar terms rather than in elapsed microseconds.
chrono = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The shadowing functions in `stats_udaf` and `ntile` change the type a *plan* advertises,
# which only a planned query can be asserted against — and planning is async.
tokio = { workspace = true }

[build-dependencies]
tonic-prost-build = { workspace = true }
