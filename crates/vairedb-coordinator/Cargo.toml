[package]
name = "vairedb-coordinator"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
vairedb-common = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
redb = { workspace = true }
pgwire = { workspace = true }
datafusion-pg-catalog = { workspace = true }
datafusion-pg-functions = { workspace = true }
arrow-pg = { workspace = true }
arrow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
datafusion = { workspace = true }
datafusion-proto = { workspace = true }
ballista-scheduler = { workspace = true }
ballista-core = { workspace = true }
xxhash-rust = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
async-trait = "0.1"
futures = "0.3"
tokio-stream = "0.1"
# The copy sub-protocol's payload type: pgwire takes `CopyData::new(Bytes)` but does
# not re-export `bytes`, so the COPY path needs it by name.
bytes = "1"
# `ToSql`, for the cells VaireDB writes to the wire itself rather than through arrow-pg —
# see `pgwire_handler::wire_types`. pgwire takes the trait but does not re-export the crate
# that defines it, and there is one version of it in the tree, so this is pgwire's own.
postgres-types = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time"] }
tokio-stream = "0.1"
tonic = { workspace = true }
vairedb-common = { workspace = true }
prost-types = { workspace = true }
