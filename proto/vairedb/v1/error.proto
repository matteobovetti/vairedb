syntax = "proto3";

package vairedb.v1;

enum VdbErrorCode {
  // Unspecified / unknown
  VDB_ERROR_CODE_UNSPECIFIED = 0;

  // Query errors (1000-1999)
  VDB_ERROR_CODE_TABLE_NOT_FOUND = 1000;
  VDB_ERROR_CODE_COLUMN_NOT_FOUND = 1001;
  VDB_ERROR_CODE_TYPE_MISMATCH = 1002;
  VDB_ERROR_CODE_SQL_SYNTAX_ERROR = 1003;
  VDB_ERROR_CODE_FEATURE_NOT_SUPPORTED = 1004;
  VDB_ERROR_CODE_TABLE_ALREADY_EXISTS = 1005;
  VDB_ERROR_CODE_COLUMN_ALREADY_EXISTS = 1006;

  // Storage errors (2000-2999)
  VDB_ERROR_CODE_SHARD_NOT_FOUND = 2000;
  VDB_ERROR_CODE_WRITE_CONFLICT = 2001;
  VDB_ERROR_CODE_ENGINE_ERROR = 2002;
  VDB_ERROR_CODE_WRITE_QUEUE_FULL = 2003;

  // Cluster errors (3000-3999)
  VDB_ERROR_CODE_NODE_NOT_FOUND = 3000;
  VDB_ERROR_CODE_NODE_UNAVAILABLE = 3001;
  VDB_ERROR_CODE_NODE_SHUTTING_DOWN = 3002;
  VDB_ERROR_CODE_QUORUM_NOT_REACHED = 3003;
  VDB_ERROR_CODE_NO_ALIVE_NODES = 3004;
  VDB_ERROR_CODE_SHARD_NOT_ASSIGNED = 3005;
  VDB_ERROR_CODE_SHARD_UNAVAILABLE = 3006;
  VDB_ERROR_CODE_NODE_COMMUNICATION_ERROR = 3007;

  // Catalog errors (4000-4999)
  VDB_ERROR_CODE_CATALOG_STORAGE_ERROR = 4000;
  VDB_ERROR_CODE_CATALOG_TRANSACTION_ERROR = 4001;
  VDB_ERROR_CODE_CATALOG_COMMIT_ERROR = 4002;
  VDB_ERROR_CODE_CATALOG_ACCESS_ERROR = 4003;

  // Internal errors (5000-5999)
  VDB_ERROR_CODE_SERIALIZATION_ERROR = 5000;
  VDB_ERROR_CODE_INTERNAL_ERROR = 5001;
}
