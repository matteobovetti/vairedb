syntax = "proto3";

package vairedb.v1;

enum VdbErrorCode {
  // Unspecified / unknown
  VDB_ERROR_CODE_UNSPECIFIED = 0;

  // Query errors (1000-1999)
  VDB_ERROR_CODE_TABLE_NOT_FOUND = 1000;
  VDB_ERROR_CODE_COLUMN_NOT_FOUND = 1001;
  VDB_ERROR_CODE_TYPE_MISMATCH = 1002;
  VDB_ERROR_CODE_SQL_SYNTAX_ERROR = 1003;
  VDB_ERROR_CODE_FEATURE_NOT_SUPPORTED = 1004;
  VDB_ERROR_CODE_TABLE_ALREADY_EXISTS = 1005;
  VDB_ERROR_CODE_COLUMN_ALREADY_EXISTS = 1006;
  VDB_ERROR_CODE_WRONG_OBJECT_TYPE = 1007;
  VDB_ERROR_CODE_IN_FAILED_TRANSACTION = 1008;
  VDB_ERROR_CODE_NO_ACTIVE_TRANSACTION = 1009;
  VDB_ERROR_CODE_INVALID_SAVEPOINT = 1010;
  VDB_ERROR_CODE_READ_ONLY_TRANSACTION = 1011;
  // A COMMIT applied some of its shard groups and then failed. The outcome of
  // the statement is genuinely unknown to the client, which is what SQLSTATE
  // 40003 (statement_completion_unknown) means.
  VDB_ERROR_CODE_PARTIAL_COMMIT = 1012;
  // A relation named a schema the catalog does not have. Distinct from
  // TABLE_NOT_FOUND because the client's mistake is one level up: the table may
  // well exist, just not there.
  VDB_ERROR_CODE_SCHEMA_NOT_FOUND = 1013;
  VDB_ERROR_CODE_SCHEMA_ALREADY_EXISTS = 1014;
  // The object named still has objects inside it, so dropping it would drop
  // them too. Reported by `DROP SCHEMA` without `CASCADE`.
  VDB_ERROR_CODE_DEPENDENT_OBJECTS_EXIST = 1015;
  // The name is not something the server has, and the client's mistake is the
  // name itself rather than a missing feature. Reported by SET/SHOW/RESET for a
  // configuration parameter VaireDB does not model, so a client can tell a typo
  // from a refusal.
  VDB_ERROR_CODE_UNDEFINED_OBJECT = 1016;
  // The name is recognized but the value is not one it can take. Reported by SET
  // for a value VaireDB's behaviour does not match, which is a different answer
  // from "SET is unsupported": the parameter works, this value does not.
  VDB_ERROR_CODE_INVALID_PARAMETER_VALUE = 1017;
  // The parameter exists and is reportable, but cannot be changed after the
  // server started. PostgreSQL reports the same for its `internal`-context
  // settings.
  VDB_ERROR_CODE_CANT_CHANGE_RUNTIME_PARAM = 1018;
  // The value is outside the range the type it must be reported as can hold, so
  // it cannot reach the client at all. Reported instead of silently substituting
  // NULL, which would look like a value that was never stored.
  VDB_ERROR_CODE_NUMERIC_VALUE_OUT_OF_RANGE = 1019;
  // A division whose divisor evaluated to zero. Its own code because the query and
  // the server are both fine and one row's data was not, which is what separates it
  // from the ENGINE_ERROR it used to be reported as — and because the float forms
  // otherwise return `inf`, a poison value that flows on into aggregates.
  VDB_ERROR_CODE_DIVISION_BY_ZERO = 1020;
  // A literal or parameter whose text is not valid for the type it is being read
  // as, such as `'x'::int`. Distinct from TYPE_MISMATCH (42804): there the two
  // types cannot meet at all, here the target type is right and the value is not
  // spelled the way it accepts.
  VDB_ERROR_CODE_INVALID_TEXT_REPRESENTATION = 1021;
  // An aggregate appearing inside another aggregate's arguments. PostgreSQL rejects
  // it at parse time (42803) rather than executing something.
  VDB_ERROR_CODE_GROUPING_ERROR = 1022;
  // A window function used where one is not allowed — a WHERE, GROUP BY or HAVING
  // clause, or nested inside another window function (42P20).
  VDB_ERROR_CODE_WINDOWING_ERROR = 1023;

  // Storage errors (2000-2999)
  VDB_ERROR_CODE_SHARD_NOT_FOUND = 2000;
  VDB_ERROR_CODE_WRITE_CONFLICT = 2001;
  VDB_ERROR_CODE_ENGINE_ERROR = 2002;
  VDB_ERROR_CODE_WRITE_QUEUE_FULL = 2003;

  // Cluster errors (3000-3999)
  VDB_ERROR_CODE_NODE_NOT_FOUND = 3000;
  VDB_ERROR_CODE_NODE_UNAVAILABLE = 3001;
  VDB_ERROR_CODE_NODE_SHUTTING_DOWN = 3002;
  VDB_ERROR_CODE_QUORUM_NOT_REACHED = 3003;
  VDB_ERROR_CODE_NO_ALIVE_NODES = 3004;
  VDB_ERROR_CODE_SHARD_NOT_ASSIGNED = 3005;
  VDB_ERROR_CODE_SHARD_UNAVAILABLE = 3006;
  VDB_ERROR_CODE_NODE_COMMUNICATION_ERROR = 3007;

  // Catalog errors (4000-4999)
  VDB_ERROR_CODE_CATALOG_STORAGE_ERROR = 4000;
  VDB_ERROR_CODE_CATALOG_TRANSACTION_ERROR = 4001;
  VDB_ERROR_CODE_CATALOG_COMMIT_ERROR = 4002;
  VDB_ERROR_CODE_CATALOG_ACCESS_ERROR = 4003;

  // Internal errors (5000-5999)
  VDB_ERROR_CODE_SERIALIZATION_ERROR = 5000;
  VDB_ERROR_CODE_INTERNAL_ERROR = 5001;
}
